<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&f[]=zodiak@700&display=swap">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#faf6ef; font-family:'General Sans',sans-serif; color:#2a2318;
         padding:74px 80px; display:flex; flex-direction:column; justify-content:space-between;
         background-image: radial-gradient(80% 60% at 100% 0%, #e5f0f6 0%, transparent 60%),
                           radial-gradient(70% 70% at 0% 100%, #f6eed9 0%, transparent 62%); }
  .top { display:flex; align-items:center; gap:20px; }
  .top img.logo { width:206px; height:auto; display:block; }
  h1 { font-family:'Zodiak',serif; font-size:66px; line-height:1.06; letter-spacing:-.025em; max-width:19ch; font-weight:700; }
  p.sub { margin-top:22px; font-size:26px; color:#6b6152; max-width:34ch; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .chip { font-size:21px; font-weight:500; padding:10px 20px; border-radius:999px; border:1.5px solid #d3c6b0; color:#4b4238; background:#fffdf9; }
  .rail { display:block; margin-left:10px; flex:none; }
</style></head>
<body>
  <div class="top">
    <img class="logo" src="./assets/logo.png" alt="Cleartrack Apps">
    <!-- a short length of track: the rail carries the colour from the logo orange
         through the wood browns into the site green, ties kept deliberately quiet -->
    <svg class="rail" width="118" height="24" viewBox="0 0 118 24" fill="none" aria-hidden="true">
      <defs><linearGradient id="railfade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="118" y2="0">
        <stop offset="0" stop-color="#f06c24"/><stop offset=".36" stop-color="#904818"/>
        <stop offset=".68" stop-color="#3b5340"/><stop offset="1" stop-color="#1c574a"/>
      </linearGradient></defs>
      <path d="M2 12h114" stroke="url(#railfade)" stroke-width="2.6" stroke-linecap="round"/>
      <g stroke="#c4b49a" stroke-width="1.5" stroke-linecap="round">
        <path d="M14 7v10"/><path d="M40 7v10"/><path d="M66 7v10"/><path d="M92 7v10"/>
      </g>
    </svg>
    </div>
  </div>
  <div>
    <h1>Small apps that quietly keep your life in order.</h1>
    <p class="sub">Pets, family health, money, kids, big plans &mdash; five simple planners for your phone.</p>
  </div>
  <div class="row">
    <div class="chip">No signal needed</div>
    <div class="chip">No app store</div>
    <div class="chip">No accounts</div>
    <div class="chip">Pay once</div>
  </div>
</body></html>
