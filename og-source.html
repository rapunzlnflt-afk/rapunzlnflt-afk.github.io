<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&f[]=zodiak@700&display=swap">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#f5f6f8; font-family:'General Sans',sans-serif; color:#24272b;
         padding:74px 80px; display:flex; flex-direction:column; justify-content:space-between;
         background-image: linear-gradient(160deg,#fafbfc 0%,#f5f6f8 40%,#eceff3 75%,#e6e9ee 100%); }
  .top { display:flex; align-items:center; gap:20px; }
  .top img.logo { width:206px; height:auto; display:block; }
  h1 { font-family:'Zodiak',serif; font-size:66px; line-height:1.06; letter-spacing:-.025em; max-width:19ch; font-weight:700; }
  p.sub { margin-top:22px; font-size:26px; color:#5d636c; max-width:34ch; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .chip { font-size:21px; font-weight:500; padding:10px 20px; border-radius:999px; border:1.5px solid #d0d4db; color:#3c4148; background:#ffffff; }
</style></head>
<body>
  <div class="top">
    <img class="logo" src="./assets/logo.png" alt="Cleartrack Apps">
    </div>
  </div>
  <div>
    <h1>Small apps that quietly keep your life in order.</h1>
    <p class="sub">Pets, family health, money, kids, big plans &mdash; five simple planners for your phone.</p>
  </div>
  <div class="row">
    <div class="chip">No signal needed</div>
    <div class="chip">No app store</div>
    <div class="chip">No accounts</div>
    <div class="chip">Data stays on your phone</div>
  </div>
</body></html>
